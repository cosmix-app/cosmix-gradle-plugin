<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090A0F" />
            <stop offset="100%" stop-color="#141824" />
        </linearGradient>
        <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF2A54" />
            <stop offset="100%" stop-color="#FF9B00" />
        </linearGradient>
        <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F2FE" />
            <stop offset="100%" stop-color="#4FACFE" />
        </linearGradient>
        <!-- Glows -->
        <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <rect width="800" height="250" fill="url(#bg)" rx="16" />
    
    <!-- Stars -->
    <g opacity="0.4">
        <circle cx="120" cy="40" r="1.5" fill="#fff" />
        <circle cx="380" cy="190" r="2" fill="#fff" opacity="0.6" />
        <circle cx="680" cy="60" r="1.5" fill="#fff" />
        <circle cx="740" cy="200" r="2" fill="#fff" opacity="0.8" />
        <circle cx="60" cy="180" r="1" fill="#fff" opacity="0.5" />
        <circle cx="480" cy="50" r="2.5" fill="#fff" opacity="0.3" />
    </g>
    
    <!-- Logo -->
    <g transform="translate(130, 125)">
        <!-- Outer orbit -->
        <circle cx="0" cy="0" r="50" fill="none" stroke="url(#accent2)" stroke-width="3" stroke-dasharray="140 40" transform="rotate(-20)" filter="url(#glowSubtle)"/>
        <!-- Inner orbit -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="url(#accent1)" stroke-width="5" stroke-dasharray="80 50" transform="rotate(70)" filter="url(#glowSubtle)"/>
        <!-- Play / spark center -->
        <path d="M-10,-16 L16,0 L-10,16 Z" fill="url(#accent2)" stroke="url(#accent2)" stroke-width="2" stroke-linejoin="round" filter="url(#glowSubtle)"/>
    </g>
    
    <!-- Typography -->
    <g transform="translate(230, 120)">
        <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
            <tspan font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4">COSMIX</tspan>
            <tspan font-size="52" font-weight="300" fill="url(#accent2)" letter-spacing="2" dx="8">GRADLE</tspan>
        </text>
        <text x="4" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#8B94A7" letter-spacing="3">
            OFFICIAL PLUGIN FOR BUILDING EXTENSIONS
        </text>
    </g>
</svg>
